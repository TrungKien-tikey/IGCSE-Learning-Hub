spring.config.import=optional:file:./.env[.properties],optional:file:../.env[.properties]
server.port=8089
spring.application.name=communication-service

# --- DATABASE ---
# Thêm serverTimezone=Asia/Ho_Chi_Minh để đồng bộ giờ DB với giờ Việt Nam
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/communication_db?useSSL=false&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true&serverTimezone=Asia/Ho_Chi_Minh
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

# Giữ update để cập nhật schema
spring.jpa.hibernate.ddl-auto=update

# --- TIMEZONE CONFIG (Quan trọng nhất) ---
# Ép toàn bộ dữ liệu Date/Time trả về qua API (JSON) về múi giờ Việt Nam
spring.jackson.time-zone=Asia/Ho_Chi_Minh

# --- RABBITMQ CONNECTION ---
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

# JWT
jwt.secret=${JWT_SECRET}

# --- RABBITMQ SETTINGS ---
rabbitmq.exchange.name=exam.exchange
rabbitmq.routing.key=exam.created
rabbitmq.queue.name=exam.created.queue

# --- OTHER SETTINGS ---
firebase.credentials-path=${FIREBASE_CREDENTIALS_PATH:./serviceAccountKey.json}
management.endpoints.web.exposure.include=health,info,prometheus